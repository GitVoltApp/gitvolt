# Windows: GitVolt's own title bar with real input (ui/scripts/win-titlebar.ps1), on the release
# app as release.yml builds it, on Windows Server 2025 (Windows 11's shell) and 2022 (Windows 10's).
# On demand only: run it from the Actions tab (workflow_dispatch), or label a pull request
# `windows` (each time the label is added). With `reuse-run`, the drive takes that run's build
# instead of building again. Actions are pinned by commit, as in release.yml.
name: Windows title bar

on:
  workflow_dispatch:
    inputs:
      reuse-run:
        description: A run of this workflow whose build to drive (its id); empty builds again
        required: false
        default: ''
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: windows-titlebar-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the app
    if: (github.event_name == 'workflow_dispatch' && inputs.reuse-run == '') || github.event.label.name == 'windows'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          $lock = Get-Content -Raw Cargo.lock
          if ($lock -notmatch 'name = "cef"\r?\nversion = "[^+"]*\+([^"]+)"') { throw 'No CEF version in Cargo.lock' }
          "cef=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows
          cache-bin: false
          save-if: false

      - name: Restore cargo-about
        id: cargo-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-tools-about-${{ env.CARGO_ABOUT_VERSION }}-windows
      - name: Install cargo-about
        if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "=$env:CARGO_ABOUT_VERSION" --locked --features cli

      - name: Restore the CEF archive and the packaging tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/tauri-cef/${{ steps.version.outputs.cef }}/cef_binary_*_windows64_minimal.tar.bz2
            target/windows-tools
          key: cef-${{ steps.version.outputs.cef }}-windows64-minimal-${{ hashFiles('scripts/package-windows.ps1') }}

      - name: Ninja on PATH
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        working-directory: ui
        run: npm ci

      # As release.yml builds it (Windows PowerShell: see there); the installers aren't needed.
      - name: Build the app
        shell: powershell
        run: |
          $env:CARGO_BUILD_JOBS = "$env:NUMBER_OF_PROCESSORS"
          just package-windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitvolt-app
          path: target/release/windows/GitVolt/
          if-no-files-found: error
          retention-days: 3

  titlebar:
    name: Drive the title bar (${{ matrix.os }})
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.reuse-run != ''))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ui/scripts

      - name: The build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.reuse-run || github.run_id }}
        run: |
          gh run download $env:RUN --repo $env:GITHUB_REPOSITORY -n gitvolt-app -D app
          if ($LASTEXITCODE) { throw "no build in run $env:RUN" }

      # The window, its frame, moves, resizes, buttons, menu, snapping, shake, restarts, the
      # system title bar setting, and 150% scaling where the session can switch to it.
      - name: Drive the title bar
        run: ./ui/scripts/win-titlebar.ps1 -App "$PWD/app/GitVolt.exe" -Out "$PWD/titlebar"

      - name: Summary
        if: always()
        run: if (Test-Path titlebar/results.md) { Get-Content titlebar/results.md | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: titlebar-${{ matrix.os }}
          path: titlebar/
          if-no-files-found: warn
          retention-days: 7
