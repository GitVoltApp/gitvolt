[package]
name = "gitvolt-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gitvolt-gpui"
path = "src/main.rs"

[dependencies]
gitvolt-core.workspace = true
gitvolt-forge.workspace = true
gitvolt-graph.workspace = true
# Zed v1.27.0. crates.io's gpui is a year behind; Zed's advice is to pin a revision until its
# automated releases land (zed-industries/zed#66275).
regex = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", features = ["wayland", "x11"] }
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
# Already in the lockfile through gpui. The formats the web UI's image diff shows, but for AVIF.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
# Markdown's blocks and inlines; what the web UI's remark plugins add is `src/md/ast.rs`.
pulldown-cmark = { version = "0.13", default-features = false }
# A file's front matter: plain data only, as `ui/src/markdown/plugins/frontmatter.ts`.
toml = { version = "1", default-features = false, features = ["parse", "serde", "preserve_order"] }
yaml-rust2 = { version = "0.13", default-features = false }
# A repository's PDFs and Mermaid diagrams, read and drawn in a process of their own (`src/worker.rs`).
hayro = "0.9"
mermaid-rs-renderer = { version = "0.3", default-features = false }
libc = "0.2"
# A font file's outlines, drawn without adding it to the app's fonts. Already in the lockfile through gpui.
ttf-parser = "0.25"
# Where a line of rendered Markdown may break. Already in the lockfile through gpui.
unicode-linebreak = "0.1"
# Oniguruma, the engine TextMate grammars are written for; Shiki runs the same one as WASM.
onig = { version = "6.5", default-features = false }
similar = "2.7"
# Counting a big file's line breaks after a keystroke. Already in the lockfile through regex.
memchr = "2"
anyhow = "1"
futures = "0.3"
raw-window-handle = "0.6.2"
smallvec = "1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Already in the lockfile through gpui. A field's caret moves by what the eye sees as a character.
unicode-segmentation = "1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", features = ["test-support"] }
