[package]
name = "gitvolt-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gitvolt"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
gitvolt-core.workspace = true
gitvolt-forge.workspace = true
tauri.workspace = true
tauri-runtime-cef.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11.workspace = true
gio.workspace = true
glib.workspace = true
raw-window-handle.workspace = true
x11-dl.workspace = true

# The title bar's double click, from the user defaults (chrome.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

# The folder dialog's owner window (`portal_parent`).
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
